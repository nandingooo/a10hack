# AgentAirlock policy (AGENTS.md section 7.1). Hand-edited. Patterns only; no real data.
trust:
  trusted:   ["user", "operator", "workspace"] # workspace trust requires explicit policy
  untrusted: ["cloned-repo", "web", "tool-output", "download"]
  # any other origin -> unknown -> treated as untrusted (fail closed)

sensitivity:
  secret:    ["**/.env", "**/.aws/credentials", "**/.ssh/*", "**/*token*", "**/*.pem", "**/id_rsa*", "**/.credentials.json", "**/.claude.json"]
  sensitive: ["**/config/*", "**/*.log", "**/customers/*"]
  # everything else -> public

bait:
  files: ["**/aws_prod_credentials.txt", "**/.env.production.local"]
  token: "AKIA_FAKE_BAIT_DO_NOT_USE"         # clearly-fake planted honeytoken value

egress:
  approved_hosts: ["github.com", "pypi.org", "*.pythonhosted.org", "api.anthropic.com", "claude.ai", "platform.claude.com", "console.anthropic.com", "bedrock-runtime.*.amazonaws.com"]
  receivers:
    # Explicit disclosure authority for the model provider, not for arbitrary websites.
    - host: api.anthropic.com
      max_sensitivity: secret
      methods: [CONNECT, POST]
    - host: claude.ai
      max_sensitivity: secret
      methods: [CONNECT, POST]
    - host: platform.claude.com
      max_sensitivity: secret
      methods: [CONNECT, POST]
    - host: console.anthropic.com
      max_sensitivity: secret
      methods: [CONNECT, POST]

workspace_root: "/work"                        # everything under here is in_workspace

sources:
  # Your own project files are trusted; only genuinely-external content stays
  # untrusted (the real prompt-injection vectors: vendored/third-party code,
  # web fetches, tool output, downloads). This stops the harness from tainting
  # the session just because the agent read your own source.
  default_origin: workspace
  rules:
    - paths: ["**/vendor/**", "**/node_modules/**", "**/third_party/**", "**/downloads/**", "**/.cache/**", "**/site-packages/**", "**/dist/**", "**/build/**", "**/.git/**"]
      origin: cloned-repo

tools:
  allowed: [] # exact MCP tool names; no implicit trust for tool output
